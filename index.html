<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#7fc4e8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%A6%8A%3C/text%3E%3C/svg%3E"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Food Chain — plant bigger animals to eat the smaller ones. Then deal with the bigger animals." />
    <title>Food Chain</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #7fc4e8;
        /* No text selection, no callouts, no rubber-band scroll: it is a game. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        touch-action: none;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #game { display: block; width: 100%; height: 100%; touch-action: none; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center; gap: 10px;
        color: #fffdf5; background: #7fc4e8; text-align: center; z-index: 20;
        transition: opacity .4s; font-weight: 800;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot h1 { font-size: 40px; margin: 0; text-shadow: 0 4px 0 rgba(0,0,0,.2); }
      #boot p { margin: 0; font-weight: 600; opacity: .9; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="boot">
      <div>
        <h1>FOOD CHAIN</h1>
        <p>tap to begin</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
